<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="/login-page/login.css">
</head>
<body>

    <div class="container">
        <div class="container-form">
            <form class="sign-in">
                <h2>Iniciar Sesión</h2>
                <div class="social-networks">
                    <ion-icon name="logo-facebook"></ion-icon>
                    <ion-icon name="logo-twitter"></ion-icon>
                    <ion-icon name="logo-instagram"></ion-icon>
                    <ion-icon name="logo-youtube"></ion-icon>
                </div>
                <span>Use su correo y contraseña</span>
                <div class="container-input">
                    <ion-icon name="mail"></ion-icon>
                    <input type="text" name="" id="input-mail" placeholder="Email">
                </div>
                <div class="container-input">
                    <ion-icon name="lock"></ion-icon>
                    <input type="password" name="" id="input-Pass" placeholder="Password">
                </div>
                <a href="">¿Olvidaste tu contraseña</a>
                <button class="btn">INICIAR SESIÓN</button>
            </form>
        </div>
        <div class="container-form">
            <form class="sign-up">
                <h2>Registrarse</h2>
                <div class="social-networks">
                    <ion-icon name="logo-facebook"></ion-icon>
                    <ion-icon name="logo-twitter"></ion-icon>
                    <ion-icon name="logo-instagram"></ion-icon>
                    <ion-icon name="logo-youtube"></ion-icon>
                </div>
                <span>Use su correo electrónico para registrarse</span>
                <div class="container-input">
                    <ion-icon name="person"></ion-icon>
                    <input type="text" name="" id="input2-Name" placeholder="Name">
                </div>
                <div class="container-input">
                    <ion-icon name="mail"></ion-icon>
                    <input type="text" name="" id="input2-mail" placeholder="Email">
                </div>
                <div class="container-input">
                    <ion-icon name="lock"></ion-icon>
                    <input type="password" name="" id="input2-Pass" placeholder="Password">
                </div>
                <a href="">¿Olvidaste tu contraseña</a>
                <button class="btn">REGISTRARSE</button>
            </form>
        </div>
    </div>
    <button id="btn">click</button>

    <script src="/login-page/script-login.js"></script>
    <script src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons.js"></script>
</body>
</html>
